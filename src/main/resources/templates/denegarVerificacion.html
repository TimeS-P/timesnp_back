<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Status de solicitud de verificación</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                line-height: 1.6;
                color: #333;
                max-width: 600px;
                margin: 0 auto;
                padding: 20px;
            }
            .container {
                border: 1px solid #ddd;
                border-radius: 5px;
                padding: 20px;
                background-color: #f9f9f9;
            }
            .header {
                text-align: center;
                margin-bottom: 20px;
                border-bottom: 1px solid #eee;
                padding-bottom: 10px;
            }
            .content {
                margin-bottom: 25px;
                text-align: center;
            }
            .footer {
                font-size: 12px;
                text-align: center;
                margin-top: 30px;
                color: #777;
            }
            .email {
                font-weight: bold;
            }
            .logo {
                text-align: center;
                margin-top: 20px;
            }
            .logo img {
                max-width: 150px;
                height: auto;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h2>Status de solicitud de verificación</h2>
            </div>
        
            <div class="content">
                <p th:text="'Estimado ' + ${name} + ','"></p>
        
                <p>Lo sentimos, su solicitud fué rechazada. A continuación se muestran los posibles motivos.</p>
                <p th:text="${message}"></p>
            </div>
        
            <div class="footer">
                <p>Este es un correo automático, por favor no respondas a este mensaje.</p>
                <p>© 2025 TimeS&P. Todos los derechos reservados.</p>
        
                <div class="logo">
                    <img src="cid:logo" alt="Logo TimeS&P" />
                </div>
            </div>
        </div>
    </body>
</html>
