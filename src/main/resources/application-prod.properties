spring.config.activate.on-profile=prod

spring.application.name=timesnp_back

# Config server
server.port=${SERVER_PORT:8080}

# Config server to use the X-Forwarded-* headers to determine the original request URL
server.forward-headers-strategy=NATIVE

# Config Spring Security Credentials
spring.security.user.name=${SECURITY_USER_NAME:admin}
spring.security.user.password=${SECURITY_USER_PASSWORD:admin}

# Límite para cada archivo
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
# Límite para toda la solicitud
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Config logging level
# Print all logs from Spring Security package
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}
# Custom logging pattern
logging.pattern.console = ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
# Custom session timeout (60 minutes)
server.servlet.session.timeout=${SESSION_TIMEOUT:60m}

# Config  database POSTGRESQL connection
spring.datasource.url=jdbc:postgresql://${POSTGRESQL_HOST:localhost}:${POSTGRESQL_PORT:5432}/${DATABASE_NAME:timesnp_back}

spring.datasource.username=${POSTGRESQL_USER:timesnpadmin}
spring.datasource.password=${POSTGRESQL_PASSWORD:timesnpadmin}


spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
# Print SQL query in console that JPA execute
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# Format SQL query in console that JPA execute
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
# Dialect of database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# Credentials for the mail
email.username=${EMAIL_USERNAME:user}
email.password=${EMAIL_PASSWORD:password}

#Thymeleaf configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Variables for GCP
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:timesnp}
spring.cloud.gcp.credentials.encoded-key=${GCP_SA_JSON_B64:base64-encoded-json}

# Configuraciones para actuator y prometheus
management.endpoints.web.exposure.include=health,info,prometheus

